<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sharable</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- CryptoJS for Cloudinary SHA-1 signing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Native App Feel: Disable browser overscroll bounce, tap highlights, and UI text selection */
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea, .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glassmorphism {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
    }
    #patternPad {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- CUSTOM TOAST NOTIFICATIONS -->
  <div id="toastContainer" class="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-5 z-[80] flex flex-col items-center sm:items-end gap-2 pointer-events-none"></div>

  <!-- CUSTOM CONFIRMATION / ALERT DIALOG -->
  <div id="customDialogModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl transform transition-all">
      <div class="flex items-center space-x-3 mb-3">
        <div id="dialogIconWrap" class="w-10 h-10 rounded-2xl bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 flex items-center justify-center flex-shrink-0">
          <i id="dialogIcon" class="fa-solid fa-triangle-exclamation text-lg"></i>
        </div>
        <h3 id="dialogTitle" class="text-base font-bold text-slate-900 dark:text-white">Confirm Action</h3>
      </div>
      <p id="dialogMessage" class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-6"></p>
      <div class="flex items-center justify-end space-x-2.5">
        <button id="dialogCancelBtn" type="button" class="px-4 py-2.5 text-xs font-semibold text-slate-600 dark:text-slate-300 active:scale-95 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition">
          Cancel
        </button>
        <button id="dialogConfirmBtn" type="button" class="px-4 py-2.5 text-xs font-semibold bg-rose-600 active:scale-95 hover:bg-rose-700 text-white rounded-xl shadow-md transition">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <!-- THEME TOGGLE FLOATING (Auth Screen) -->
  <div id="floatingThemeWrap" class="fixed top-4 right-4 z-50 flex items-center space-x-2">
    <button id="themeToggleBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-amber-400 active:scale-90 transition-transform flex items-center justify-center" title="Toggle Light/Dark Theme">
      <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
    </button>
  </div>

  <!-- ========================================================= -->
  <!-- VIEW 1: PATTERN AUTHENTICATION SCREEN (LOGIN / REGISTER)  -->
  <!-- ========================================================= -->
  <div id="authScreen" class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-20 -left-20 w-44 h-44 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-20 -right-20 w-44 h-44 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Brand Header -->
      <div class="text-center mb-5 relative">
        <div class="w-14 h-14 mx-auto mb-2.5 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-share-nodes text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Sharable</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Draw your pattern to unlock or create a vault</p>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl mb-5 text-xs font-semibold">
        <button id="tabLogin" onclick="switchAuthMode('login')" class="flex-1 py-2.5 rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-white shadow-sm transition">
          Unlock Vault
        </button>
        <button id="tabRegister" onclick="switchAuthMode('register')" class="flex-1 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
          Create New User
        </button>
      </div>

      <!-- New User Name Input -->
      <div id="registerNameWrap" class="hidden mb-4">
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Your Name</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="newUserNameInput" placeholder="Enter your name (e.g. Aklavya)"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-900 dark:text-white">
        </div>
      </div>

      <!-- Step Instruction Banner -->
      <div class="text-center mb-3">
        <span id="patternStepBadge" class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border border-indigo-200/70 dark:border-indigo-800/60">
          <i class="fa-solid fa-fingerprint"></i>
          <span id="patternInstructionText">Draw your pattern to unlock</span>
        </span>
      </div>

      <!-- 3x3 Interactive Pattern Lock Canvas -->
      <div class="flex flex-col items-center justify-center my-2">
        <div id="patternPad" class="relative w-64 h-64 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-inner flex items-center justify-center cursor-pointer">
          <svg id="patternSvg" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 256 256">
            <polyline id="patternLine" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="" />
            <line id="patternActiveLine" x1="0" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,5" stroke-linecap="round" class="hidden" />
          </svg>
          <div id="patternNodesGrid" class="grid grid-cols-3 w-full h-full p-5 place-items-center z-10"></div>
        </div>

        <div class="mt-3 flex items-center justify-between w-64 px-1">
          <div class="text-xs text-slate-400 flex items-center space-x-1.5">
            <span>Sequence:</span>
            <span id="patternDigitsPreview" class="font-mono font-bold text-slate-700
