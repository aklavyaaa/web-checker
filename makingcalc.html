<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYSTEM_OVERRIDE_V4.02</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #030a05;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* Top HUD / Status Bar */
    .hud-header {
      border-bottom: 1px solid #00ff6644;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 102, 0.05);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hud-alert {
      color: #ff3344;
      animation: blink 0.8s infinite;
    }

    /* Memory Stream & Random Hex Grid */
    .stream-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 14px;
      background: #000;
      border-bottom: 1px dashed #00ff6633;
      font-size: 11px;
      color: #00aa44;
    }

    .stream-box div {
      overflow: hidden;
      white-space: nowrap;
    }

    /* Dynamic Stage Progress */
    .mission-status {
      padding: 12px 14px;
      background: rgba(255, 51, 68, 0.08);
      border-bottom: 1px solid #ff334444;
    }

    .target-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }

    .target-action {
      font-size: 14px;
      color: #ff3344;
      font-weight: bold;
      text-shadow: 0 0 4px #ff3344;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #111;
      border: 1px solid #00ff6666;
      margin-top: 8px;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
      transition: width 0.3s ease;
    }

    /* Terminal Feed */
    .terminal-container {
      flex: 1;
      padding: 12px 14px;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: radial-gradient(circle at center, #051408 0%, #020703 100%);
      font-size: 12px;
      line-height: 1.45;
    }

    .log-entry {
      margin-bottom: 4px;
      word-break: break-all;
      opacity: 0.9;
    }

    .log-warn { color: #ffbb00; }
    .log-danger { color: #ff3344; font-weight: bold; }
    .log-success { color: #00ffff; }

    /* Interactive Overlay Button */
    .action-panel {
      padding: 12px 14px;
      border-top: 1px solid #00ff6633;
      background: #000;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:active {
      background: #00ff66;
      color: #000;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="hud-header">
    <span>DEVICE: LOCAL_HOST</span>
    <span class="hud-alert" id="status-tag">BREACH IN PROGRESS</span>
  </div>

  <!-- Random Hex/Number Stream -->
  <div class="stream-box" id="hex-grid">
    <div id="h1">0x0000</div>
    <div id="h2">0x0000</div>
    <div id="h3">0x0000</div>
    <div id="h4">0x0000</div>
  </div>

  <!-- Stage & Progress -->
  <div class="mission-status">
    <div class="target-label">ACTIVE TASK:</div>
    <div class="target-action" id="target-action">INITIALIZING EXPLOIT...</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Running Terminal -->
  <div class="terminal-container" id="terminal">
    <!-- Log rows injected dynamically -->
  </div>

  <!-- Action Controls -->
  <div class="action-panel">
    <button class="btn" onclick="toggleFullScreen()">Fullscreen</button>
    <button class="btn" style="border-color: #ff3344; color: #ff3344;" onclick="triggerCritical()">Bypass Lock</button>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const progressFill = document.getElementById('progress-fill');
    const targetAction = document.getElementById('target-action');
    const statusTag = document.getElementById('status-tag');

    // Stage targets
    const stages = [
      "BYPASSING LOCAL SANDBOX...",
      "CRACKING ENCRYPTED PHOTO VAULT...",
      "EXTRACTING RECENT SMS & CHATS...",
      "DUMPING SAVED PASSWORDS & TOKENS...",
      "CLONING CONTACT LIST (482 FOUND)...",
      "SYNCING LIVE MICROPHONE FEED...",
      "ACCESSING STORED BIOMETRIC KEYS...",
      "PACKAGING AND UPLOADING EXFIL ARCHIVE..."
    ];

    let currentProgress = 0;
    let stageIndex = 0;

    // Realistic terminal output snippets
    const logPool = [
      { text: "[OK] Bound socket to port 4444 (TCP/IPv4)", type: "normal" },
      { text: "Found root keychain: /private/var/Keychains/Keychain-2.db", type: "log-warn" },
      { text: "Injecting payload into com.apple.MobileSMS process...", type: "normal" },
      { text: "DUMP: DCIM/100APPLE/IMG_8392.JPG (4.2 MB) Extracted", type: "log-success" },
      { text: "DUMP: DCIM/100APPLE/IMG_8393.JPG (3.8 MB) Extracted", type: "log-success" },
      { text: "Extracting WhatsApp chat databases (_chat.db)...", type: "log-warn" },
      { text: "CRITICAL: Security daemon watchdog disabled.", type: "log-danger" },
      { text: "Decrypted token: ghp_99xKaL908129038410294820", type: "log-warn" },
      { text: "Reading GPS cache: Lat 37.7749, Lon -122.4194", type: "normal" },
      { text: "Extracting Chrome / Safari Saved Passwords (24 records)...", type: "log-danger" },
      { text: "UPLOADING: payload_archive_092.bin -> remote_server:8080", type: "log-warn" },
      { text: "[STATUS 200] Stream handshake confirmed.", type: "normal" }
    ];

    // Log injector
    function addLog(text, type = "normal") {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `> ${text}`;
      terminal.appendChild(entry);

      // Keep terminal clean
      if (terminal.children.length > 18) {
        terminal.removeChild(terminal.firstChild);
      }
    }

    // Hex and random number generator
    function updateHexGrid() {
      for (let i = 1; i <= 4; i++) {
        const randHex = '0x' + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0');
        document.getElementById(`h${i}`).innerText = randHex;
      }
    }

    // Main execution loop
    setInterval(updateHexGrid, 80);

    // Terminal fast feed
    setInterval(() => {
      const item = logPool[Math.floor(Math.random() * logPool.length)];
      addLog(item.text, item.type);
    }, 450);

    // Stage & Progress ticker
    setInterval(() => {
      currentProgress += 1;
      if (currentProgress > 100) {
        currentProgress = 0;
        stageIndex = (stageIndex + 1) % stages.length;
        targetAction.innerText = stages[stageIndex];
      }
      progressFill.style.width = currentProgress + '%';
    }, 200);

    // Extra trigger for dramatic effect
    function triggerCritical() {
      addLog("OVERRIDE INITIATED: FORCE MEMORY FLUSH", "log-danger");
      addLog("ALL RESTRICTIONS PURGED: FULL ACCESS GRANTED", "log-danger");
      statusTag.innerText = "DEVICE COMPROMISED";
      statusTag.style.color = "#00ffff";
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
