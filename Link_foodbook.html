<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real-Time Collaborative Whiteboard</title>
  <!-- PeerJS Library for WebRTC peer-to-peer connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none; /* Prevents mobile browser pull-to-refresh & scrolling */
    }

    /* Auth Screen Overlay */
    #auth-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(244, 246, 249, 0.98);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 90%;
      max-width: 320px;
    }

    .card h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 20px;
    }

    .card button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .btn-secondary {
      background-color: #28a745;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #1e7e34;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    /* Header & Controls */
    header {
      background: white;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toolbar label {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      cursor: pointer;
      background: none;
      border-radius: 4px;
    }

    .toolbar input[type="range"] {
      width: 70px;
    }

    .toolbar button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #f8f9fa;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .toolbar button:active {
      background: #e2e6ea;
    }

    .connection-indicator {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-disconnected { color: #dc3545; }
    .status-connected { color: #28a745; }

    /* Canvas Container */
    #canvas-container {
      flex: 1;
      position: relative;
      background: white;
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div id="auth-screen">
    <div class="card">
      <h2>Select User Role</h2>
      <button class="btn-primary" onclick="login('user1')">Login as User 1</button>
      <button class="btn-secondary" onclick="login('user2')">Login as User 2</button>
      <div id="status">Select a user to connect</div>
    </div>
  </div>

  <!-- Header Controls -->
  <header>
    <div class="toolbar">
      <label>Color <input type="color" id="colorPicker" value="#000000"></label>
      <label>Size <input type="range" id="lineWidth" min="1" max="30" value="5"></label>
      <button onclick="clearCanvas(true)">Clear</button>
    </div>
    <div class="connection-indicator">
      Status: <span id="peer-status" class="status-disconnected">Offline</span>
    </div>
  </header>

  <!-- Whiteboard Canvas -->
  <div id="canvas-container">
    <canvas id="whiteboard"></canvas>
  </div>

  <script>
    // Canvas Setup
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const lineWidth = document.getElementById('lineWidth');

    let isDrawing = false;
    let currentUser = null;
    let peer = null;
    let conn = null;

    // Resize canvas dynamically to match layout
    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      const rect = container.getBoundingClientRect();
      
      // Store current drawing before resizing
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0);

      canvas.width = rect.width;
      canvas.height = rect.height;

      // Restore drawing
      ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    // Get pointer coordinates (handles both Touch and Mouse)
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      return {
        xRatio: (clientX - rect.left) / canvas.width,
        yRatio: (clientY - rect.top) / canvas.height
      };
    }

    // Event Handlers for Mouse & Touch
    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getPointerPos(e);
      draw(e);
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.beginPath();

      // Notify peer that drawing stroke has ended
      if (conn && conn.open) {
        conn.send({ type: 'end' });
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();

      const pos = getPointerPos(e);
      const strokeData = {
        xRatio: pos.xRatio,
        yRatio: pos.yRatio,
        color: colorPicker.value,
        size: lineWidth.value
      };

      // Draw locally
      renderStroke(strokeData);

      // Send stroke data to connected peer
      if (conn && conn.open) {
        conn.send({ type: 'draw', data: strokeData });
      }
    }

    function renderStroke(data) {
      ctx.lineWidth = data.size;
      ctx.lineCap = 'round';
      ctx.strokeStyle = data.color;

      const x = data.xRatio * canvas.width;
      const y = data.yRatio * canvas.height;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function clearCanvas(broadcast = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (broadcast && conn && conn.open) {
        conn.send({ type: 'clear' });
      }
    }

    // Attach Unified Event Listeners (Desktop + Android Touch)
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    // Initial resize call
    resizeCanvas();

    // PeerJS Connection Management
    function login(userRole) {
      currentUser = userRole;
      document.getElementById('status').innerText = `Initializing as ${userRole}...`;

      const myPeerId = userRole === 'user1' ? 'draw-app-user-1' : 'draw-app-user-2';
      const targetPeerId = userRole === 'user1' ? 'draw-app-user-2' : 'draw-app-user-1';

      peer = new Peer(myPeerId);

      peer.on('open', (id) => {
        document.getElementById('auth-screen').style.display = 'none';
        updateStatus(false, 'Waiting for peer...');

        if (currentUser === 'user2') {
          connectToPeer(targetPeerId);
        }
      });

      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupConnectionEvents();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          alert(`${userRole} is already logged in on another device or window.`);
        } else {
          console.error('PeerJS error:', err);
        }
        document.getElementById('status').innerText = 'Connection error. Try again.';
      });
    }

    function connectToPeer(targetId) {
      conn = peer.connect(targetId);
      setupConnectionEvents();
    }

    function setupConnectionEvents() {
      conn.on('open', () => {
        updateStatus(true, 'Connected');
      });

      conn.on('data', (payload) => {
        if (payload.type === 'draw') {
          renderStroke(payload.data);
        } else if (payload.type === 'end') {
          ctx.beginPath();
        } else if (payload.type === 'clear') {
          clearCanvas(false);
        }
      });

      conn.on('close', () => {
        updateStatus(false, 'Peer disconnected');
      });
    }

    function updateStatus(isConnected, message) {
      const statusElem = document.getElementById('peer-status');
      statusElem.innerText = message;
      statusElem.className = isConnected ? 'status-connected' : 'status-disconnected';
    }
  </script>
</body>
</html>
