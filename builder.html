<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal APK Build Console</title>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
            color: #f0f6fc;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="password"], select {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 1rem;
            outline: none;
        }
        select {
            cursor: pointer;
        }
        input[type="password"]:focus, select:focus {
            border-color: #58a6ff;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-bottom: 16px;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #238636;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #2ea44f;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
        .btn-copy {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-copy:hover {
            background-color: #30363d;
            color: #79c0ff;
        }
        .btn:disabled {
            background-color: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            cursor: not-allowed;
            transform: none;
        }
        .status-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-top: 8px;
        }
        .status-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            margin-bottom: 8px;
        }
        .status-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #58a6ff;
        }
        .progress-container {
            width: 100%;
            background-color: #30363d;
            height: 8px;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #58a6ff;
            transition: width 0.4s ease;
        }
        .log-box {
            margin-top: 16px;
            background-color: #05070a;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 12px;
            display: none;
        }
        .log-terminal {
            width: 100%;
            height: 160px;
            background: transparent;
            color: #f0f6fc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            border: none;
            resize: none;
            outline: none;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Universal APK Console</h2>
        <div class="subtitle" id="consoleSubtitle">Secure Local Session</div>

        <div class="form-group">
            <label for="tokenInput">ENTER SECRET CODE</label>
            <input type="password" id="tokenInput" placeholder="••••••••••••••••" oninput="initializeDashboard()">
        </div>

        <div class="form-group">
            <label for="repoSelect">CHOOSE TARGET REPOSITORY</label>
            <select id="repoSelect" onchange="onRepoChange()" disabled>
                <option>Awaiting Secret Code validation...</option>
            </select>
        </div>

        <button id="uploadBtn" class="btn btn-primary" onclick="triggerBuild()" disabled>🚀 Start Cloud Build</button>
        <button id="downloadBtn" class="btn btn-secondary" onclick="downloadArtifact()" disabled>📦 Download APK File</button>

        <div class="status-box">
            <div class="status-title">System Status</div>
            <div id="statusText" class="status-text" style="color: #8b949e;">Please provide your Secret Code above to unlock.</div>
            <div id="progressContainer" class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="log-box" id="logBox">
            <div class="status-header-row">
                <div class="status-title" style="margin: 0;">Detailed Logs / Errors</div>
                <button class="btn-copy" onclick="copyLogs()">📋 Copy Whole Log</button>
            </div>
            <textarea id="logTerminal" class="log-terminal" readonly></textarea>
        </div>
    </div>

    <script>
        const OWNER = "aklavyaaa";
        const WORKFLOW_ID = "manual-build.yml";

        let selectedRepo = "";
        let defaultBranch = "main";
        let intervalId = null;
        let activeRunId = null;

        function getHeaders() {
            const tokenValue = document.getElementById("tokenInput").value.trim();
            return {
                "Authorization": `token ${tokenValue}`,
                "Accept": "application/vnd.github+json"
            };
        }

        window.onload = function() {
            const savedToken = localStorage.getItem("gh_pat_secure");
            if (savedToken) {
                document.getElementById("tokenInput").value = savedToken;
                initializeDashboard();
            }
        };

        async function initializeDashboard() {
            const tokenValue = document.getElementById("tokenInput").value.trim();
            const statusText = document.getElementById("statusText");
            
            if (!tokenValue.startsWith("ghp_")) {
                statusText.innerText = "Awaiting a valid Secret Code...";
                statusText.style.color = "#8b949e";
                document.getElementById("repoSelect").disabled = true;
                document.getElementById("uploadBtn").disabled = true;
                return;
            }

            localStorage.setItem("gh_pat_secure", tokenValue);
            statusText.innerText = "Unlocking Console & Fetching Repositories...";
            statusText.style.color = "#58a6ff";
            
            await fetchRepositories();
        }

        async function fetchRepositories() {
            const repoSelect = document.getElementById("repoSelect");
            const statusText = document.getElementById("statusText");
            
            try {
                const response = await fetch(`https://api.github.com/user/repos?per_page=100&sort=pushed`, { headers: getHeaders() });
                if (!response.ok) throw new Error("Invalid Secret Code or mapping configuration error.");
                
                const repos = await response.json();
                repoSelect.innerHTML = "";
                
                if(repos.length === 0) {
                    repoSelect.innerHTML = "<option>No repositories found</option>";
                    statusText.innerText = "No projects found under this account.";
                    return;
                }

                repos.forEach(repo => {
                    let option = document.createElement("option");
                    option.value = repo.name;
                    option.text = repo.name;
                    option.dataset.branch = repo.default_branch;
                    repoSelect.appendChild(option);
                });

                repoSelect.disabled = false;
                onRepoChange();
            } catch (error) {
                statusText.innerText = "Access Denied. Double-check your Secret Code.";
                statusText.style.color = "#f85149";
                showErrorInTerminal(error.toString());
            }
        }

        function onRepoChange() {
            const repoSelect = document.getElementById("repoSelect");
            const selectedOption = repoSelect.options[repoSelect.selectedIndex];
            
            selectedRepo = repoSelect.value;
            defaultBranch = selectedOption.dataset.branch;
            activeRunId = null;
            
            document.getElementById("statusText").innerText = `Target: ${selectedRepo} (${defaultBranch})`;
            document.getElementById("statusText").style.color = "#58a6ff";
            document.getElementById("uploadBtn").disabled = false;
            document.getElementById("downloadBtn").disabled = true;
            document.getElementById("progressContainer").style.display = "none";
            document.getElementById("logBox").style.display = "none";
            document.getElementById("logTerminal").value = "";
            
            if (intervalId) clearInterval(intervalId);
        }

        async function triggerBuild() {
            const statusText = document.getElementById("statusText");
            const uploadBtn = document.getElementById("uploadBtn");
            const downloadBtn = document.getElementById("downloadBtn");
            const progressContainer = document.getElementById("progressContainer");
            const progressBar = document.getElementById("progressBar");

            statusText.innerText = `Triggering build for ${selectedRepo}...`;
            statusText.style.color = "#58a6ff";
            uploadBtn.disabled = true;
            downloadBtn.disabled = true;
            document.getElementById("logBox").style.display = "none";
            document.getElementById("logTerminal").value = "";

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${selectedRepo}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({ ref: defaultBranch })
                });

                if (response.status === 204) {
                    statusText.innerText = "Build requested! Waiting for cloud runner...";
                    progressContainer.style.display = "block";
                    progressBar.style.width = "10%";
                    
                    setTimeout(() => {
                        startCheckingStatus();
                    }, 10000);
                } else {
                    const data = await response.json().catch(() => ({}));
                    statusText.innerText = `Error running build. Check setup logs below.`;
                    statusText.style.color = "#f85149";
                    uploadBtn.disabled = false;
                    showErrorInTerminal(`HTTP Status: ${response.status}\nError Details: ${data.message || response.statusText || 'Workflow config folder missing.'}\n\nMake sure '.github/workflows/${WORKFLOW_ID}' exists inside the target repository branch.`);
                }
            } catch (error) {
                statusText.innerText = `Connection Failed`;
                statusText.style.color = "#f85149";
                uploadBtn.disabled = false;
                showErrorInTerminal(error.toString());
            }
        }

        function startCheckingStatus() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(checkStatus, 15000);
            checkStatus();
        }

        async function checkStatus() {
            const statusText = document.getElementById("statusText");
            const progressBar = document.getElementById("progressBar");
            const uploadBtn = document.getElementById("uploadBtn");
            const downloadBtn = document.getElementById("downloadBtn");

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${selectedRepo}/actions/runs?workflow_id=${WORKFLOW_ID}`, { headers: getHeaders() });
                const data = await response.json();

                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const latestRun = data.workflow_runs[0];
                    activeRunId = latestRun.id; 
                    const status = latestRun.status;         
                    const conclusion = latestRun.conclusion; 

                    if (status === "queued") {
                        statusText.innerText = "Cloud Status: Queued...";
                        statusText.style.color = "#d29922";
                        progressBar.style.width = "30%";
                    } else if (status === "in_progress") {
                        statusText.innerText = "Cloud Status: Compiling APK...";
                        statusText.style.color = "#58a6ff";
                        progressBar.style.width = "60%";
                    } else if (status === "completed") {
                        clearInterval(intervalId);
                        uploadBtn.disabled = false;
                        
                        if (conclusion === "success") {
                            statusText.innerText = "Build Successful! ✅ Ready to download.";
                            statusText.style.color = "#3fb950";
                            progressBar.style.width = "100%";
                            downloadBtn.disabled = false;
                        } else {
                            statusText.innerText = `Build Failed ❌ (${conclusion})`;
                            statusText.style.color = "#f85149";
                            progressBar.style.width = "0%";
                            fetchFailedLogs();
                        }
                    }
                }
            } catch (error) {
                console.error("Error fetching status:", error);
            }
        }

        async function fetchFailedLogs() {
            if (!activeRunId) return;
            showErrorInTerminal("Fetching comprehensive compilation break reports from cloud runner layers...");
            
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${selectedRepo}/actions/runs/${activeRunId}/jobs`, { headers: getHeaders() });
                const data = await response.json();
                
                let errorDetails = `=== CRITICAL COMPILATION FAULT REPORT ===\nRun ID: ${activeRunId}\n`;
                if(data.jobs && data.jobs.length > 0) {
                    data.jobs.forEach(job => {
                        errorDetails += `Job Name: ${job.name} -> Target Status: ${job.conclusion}\n`;
                        if(job.steps) {
                            job.steps.forEach(step => {
                                if(step.conclusion === "failure") {
                                    errorDetails += `\n[X] BROKEN ENVIRONMENT COMPONENT DETECTED:\nStep Name: "${step.name}"\nStatus: Failed\n`;
                                }
                            });
                        }
                    });
                    errorDetails += `\nFix Steps:\n1. Pull your code locally and verify your dependencies inside build.gradle or settings.gradle.\n2. Ensure compileSdkVersion and JDK versions match structural targets.\n3. Push the fixed workspace changes back to GitHub and launch a fresh compilation build query loop.`;
                } else {
                    errorDetails += "Failed to parse individual workflow runner modules data metrics.";
                }
                showErrorInTerminal(errorDetails);
            } catch (e) {
                showErrorInTerminal(`Decompiled report stream metrics collection failure state: ${e.toString()}`);
            }
        }

        function showErrorInTerminal(text) {
            const logBox = document.getElementById("logBox");
            const logTerminal = document.getElementById("logTerminal");
            logBox.style.display = "block";
            logTerminal.value = text;
        }

        function copyLogs() {
            const logTerminal = document.getElementById("logTerminal");
            if (!logTerminal.value) {
                alert("No log errors found to copy!");
                return;
            }
            logTerminal.select();
            logTerminal.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(logTerminal.value);
            alert("Whole log block successfully copied to clipboard!");
        }

        async function downloadArtifact() {
            const statusText = document.getElementById("statusText");
            statusText.innerText = "Locating build archive...";

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${selectedRepo}/actions/artifacts`, { headers: getHeaders() });
                const data = await response.json();

                if (data.artifacts && data.artifacts.length > 0) {
                    const artifactId = data.artifacts[0].id;
                    statusText.innerText = "Downloading zip container...";
                    
                    const downloadUrl = `https://api.github.com/repos/${OWNER}/${selectedRepo}/actions/artifacts/${artifactId}/zip`;
                    
                    fetch(downloadUrl, { headers: getHeaders() })
                        .then(res => {
                            if (!res.ok) throw new Error("File stream error");
                            return res.arrayBuffer();
                        })
                        .then(buffer => {
                            statusText.innerText = "Extracting raw APK in memory...";
                            
                            const zippedUint8 = new Uint8Array(buffer);
                            const unzippedFiles = fflate.unzipSync(zippedUint8);
                            
                            let apkFileName = Object.keys(unzippedFiles).find(name => name.endsWith('.apk'));
                            
                            if (!apkFileName) {
                                throw new Error("No APK file found inside the package.");
                            }
                            
                            const apkData = unzippedFiles[apkFileName];
                            const blob = new Blob([apkData], { type: "application/vnd.android.package-archive" });
                            
                            const url = window.URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.setAttribute('download', `${selectedRepo}-build.apk`);
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                            window.URL.revokeObjectURL(url);
                            
                            statusText.innerText = "APK downloaded directly! Tap to install.";
                            statusText.style.color = "#3fb950";
                        }).catch((err) => {
                            statusText.innerText = `Extraction failed: ${err.message || err}`;
                            statusText.style.color = "#f85149";
                            showErrorInTerminal(err.toString());
                        });

                } else {
                    statusText.innerText = "No build packages found on server.";
                    statusText.style.color = "#f85149";
                }
            } catch (error) {
                statusText.innerText = "Failed to pull down file artifact.";
                statusText.style.color = "#f85149";
                showErrorInTerminal(error.toString());
            }
        }
    </script>
</body>
</html>
