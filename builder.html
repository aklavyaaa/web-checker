<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal APK Console</title>
    <!-- Lightweight Unzip Library -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
    <!-- Three.js for 3D Dynamic Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* ==========================================================
           COLOR PALETTES & THEME VARIABLES
           ========================================================== */
        :root {
            /* Default: Rose Gold & Latte */
            --bg-base: #f7f3f0;
            --card-bg: rgba(255, 252, 249, 0.75);
            --input-bg: #f2ebe5;
            --text-main: #4a3e3d;
            --text-muted: #9e8c8a;
            --accent-primary: #d4a373;
            --accent-secondary: #e7c6ff;
            --shadow-outer: 12px 12px 24px #e0d8d0, -12px -12px 24px #ffffff;
            --shadow-inset: inset 4px 4px 8px #e0d8d0, inset -4px -4px 8px #ffffff;
            --btn-primary-bg: linear-gradient(135deg, #ddbea9, #d4a373);
            --btn-secondary-bg: linear-gradient(135deg, #f8edeb, #f2ebe5);
            --btn-danger-bg: linear-gradient(135deg, #f0a6a6, #e57373);
            --success: #81c784;
            --warning: #ffb74d;
            --error: #e57373;
        }

        /* Theme 2: Sage & Eucalyptus */
        [data-theme="sage"] {
            --bg-base: #f0f4f1;
            --card-bg: rgba(250, 252, 250, 0.75);
            --input-bg: #e2ebe4;
            --text-main: #344037;
            --text-muted: #829486;
            --accent-primary: #87a96b;
            --accent-secondary: #c5dad1;
            --shadow-outer: 12px 12px 24px #d8e2da, -12px -12px 24px #ffffff;
            --shadow-inset: inset 4px 4px 8px #d8e2da, inset -4px -4px 8px #ffffff;
            --btn-primary-bg: linear-gradient(135deg, #a3b18a, #588157);
            --btn-secondary-bg: linear-gradient(135deg, #e9edc9, #e2ebe4);
        }

        /* Theme 3: Pastel Lavender */
        [data-theme="lavender"] {
            --bg-base: #f4f0f8;
            --card-bg: rgba(253, 250, 255, 0.75);
            --input-bg: #e8e0f0;
            --text-main: #40354a;
            --text-muted: #8d7e9e;
            --accent-primary: #b5e2fa;
            --accent-secondary: #edc7b7;
            --shadow-outer: 12px 12px 24px #ded2e8, -12px -12px 24px #ffffff;
            --shadow-inset: inset 4px 4px 8px #ded2e8, inset -4px -4px 8px #ffffff;
            --btn-primary-bg: linear-gradient(135deg, #c8b6ff, #9bf6ff);
            --btn-secondary-bg: linear-gradient(135deg, #f3edf8, #e8e0f0);
        }

        /* Theme 4: Cyber Slate */
        [data-theme="slate"] {
            --bg-base: #1e2022;
            --card-bg: rgba(36, 39, 42, 0.85);
            --input-bg: #181a1b;
            --text-main: #f0f2f5;
            --text-muted: #88929b;
            --accent-primary: #64b5f6;
            --accent-secondary: #81c784;
            --shadow-outer: 10px 10px 20px #141517, -10px -10px 20px #282b2d;
            --shadow-inset: inset 4px 4px 8px #141517, inset -4px -4px 8px #282b2d;
            --btn-primary-bg: linear-gradient(135deg, #42a5f5, #1e88e5);
            --btn-secondary-bg: linear-gradient(135deg, #2c3034, #181a1b);
        }

        /* ==========================================================
           GLOBAL & ANIMATION STYLES
           ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--input-bg);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .splash-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.1em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Layout Grid & Keyframes */
        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            z-index: 10;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards & Soft Clay/Glass */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-outer);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        h2 { font-size: 1.3rem; color: var(--text-main); font-weight: 700; }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }

        /* Theme Selector Controls */
        .theme-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .theme-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: var(--shadow-outer);
            transition: transform 0.2s ease;
        }

        .theme-btn:hover { transform: scale(1.2); }

        /* Form Controls */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: none;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
            box-shadow: var(--shadow-inset);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            box-shadow: var(--shadow-inset), 0 0 0 2px var(--accent-primary);
        }

        /* Soft Tactile Buttons */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            color: #ffffff;
            background: var(--btn-primary-bg);
            box-shadow: var(--shadow-outer);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-secondary { background: var(--btn-secondary-bg); color: var(--text-main); }
        .btn-danger { background: var(--btn-danger-bg); }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: var(--shadow-inset);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Status & Log Box */
        .status-box {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-inset);
            margin-top: 12px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-primary);
            word-break: break-word;
        }

        .progress-container {
            width: 100%;
            background: rgba(0,0,0,0.06);
            height: 8px;
            border-radius: 6px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
            box-shadow: var(--shadow-inset);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-primary);
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .log-box { display: none; margin-top: 12px; }

        .log-terminal {
            width: 100%;
            height: 160px;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 12px;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            border: none;
            resize: none;
            outline: none;
            box-shadow: var(--shadow-inset);
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-outer);
            font-size: 0.85rem;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- Dynamic 3D Background Canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- Aesthetic Entrance Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="spinner"></div>
        <div class="splash-text">UNIVERSAL APK CONSOLE</div>
    </div>

    <!-- Main Workspace Grid -->
    <div class="container">
        <!-- Control Card -->
        <div class="card">
            <div class="header-title">
                <h2>APK Build Console</h2>
                <!-- Theme Palette Selector -->
                <div class="theme-bar">
                    <div class="theme-btn" style="background:#d4a373;" onclick="setTheme('')" title="Rose Gold"></div>
                    <div class="theme-btn" style="background:#87a96b;" onclick="setTheme('sage')" title="Sage"></div>
                    <div class="theme-btn" style="background:#c8b6ff;" onclick="setTheme('lavender')" title="Lavender"></div>
                    <div class="theme-btn" style="background:#42a5f5;" onclick="setTheme('slate')" title="Slate"></div>
                </div>
            </div>
            <div class="subtitle">Soft Aesthetic Cloud Suite</div>

            <div class="form-group">
                <label for="ownerInput">GITHUB OWNER</label>
                <input type="text" id="ownerInput" value="aklavyaaa" onchange="initializeDashboard()">
            </div>

            <div class="form-group">
                <label for="tokenInput">SECRET CODE</label>
                <input type="password" id="tokenInput" placeholder="ghp_... or github_pat_..." oninput="initializeDashboard()">
            </div>

            <div class="form-group">
                <label for="repoSelect">REPOSITORY</label>
                <select id="repoSelect" onchange="onRepoChange()" disabled>
                    <option>Awaiting Secret Code...</option>
                </select>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label for="branchSelect">BRANCH</label>
                    <select id="branchSelect" disabled><option>main</option></select>
                </div>
                <div>
                    <label for="workflowSelect">WORKFLOW</label>
                    <select id="workflowSelect" disabled><option>manual-build.yml</option></select>
                </div>
            </div>

            <button id="uploadBtn" class="btn" onclick="triggerBuild()" disabled>🚀 Start Cloud Build</button>

            <div class="btn-group">
                <button id="cancelBtn" class="btn btn-danger" onclick="cancelBuild()" disabled>🛑 Cancel</button>
                <button id="retriggerBtn" class="btn btn-secondary" onclick="triggerBuild()" disabled>🔁 Re-Trigger</button>
            </div>
        </div>

        <!-- Status & Download Card -->
        <div class="card">
            <h2>Status & Download</h2>
            <div class="subtitle">Live Cloud Monitor</div>

            <div class="status-box">
                <div class="status-header">
                    <span id="authModeTag" style="font-size:0.75rem; font-weight:700; color:var(--text-muted);">IDLE</span>
                    <span id="timerText" style="font-size:0.75rem; color:var(--text-muted);">00:00</span>
                </div>
                <div id="statusText" class="status-text">Provide Secret Code to unlock.</div>

                <div id="progressContainer" class="progress-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label for="apkNameInput">OUTPUT APK NAME</label>
                <input type="text" id="apkNameInput" placeholder="app-release.apk">
            </div>

            <button id="downloadBtn" class="btn" onclick="downloadArtifact()" disabled>📦 Download APK File</button>
        </div>

        <!-- Logs Box -->
        <div class="card full-width log-box" id="logBox">
            <div class="header-title">
                <h2>Compilation Logs</h2>
                <button class="btn btn-secondary" style="padding:6px 12px; font-size:0.75rem;" onclick="copyLogs()">📋 Copy Logs</button>
            </div>
            <textarea id="logTerminal" class="log-terminal" readonly></textarea>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Notification</div>

    <script>
        /* ==========================================================
           3D DYNAMIC BACKGROUND ENGINE (THREE.JS)
           ========================================================== */
        let scene, camera, renderer, shapes = [];

        function init3D() {
            const canvas = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Create Soft Floating Geometries
            const geometries = [
                new THREE.TorusKnotGeometry(1, 0.3, 100, 16),
                new THREE.IcosahedronGeometry(1.2, 0),
                new THREE.SphereGeometry(1, 32, 32)
            ];

            const material = new THREE.MeshNormalMaterial({ wireframe: true, opacity: 0.15, transparent: true });

            for (let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(geometries[i % geometries.length], material);
                mesh.position.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                scene.add(mesh);
                shapes.push(mesh);
            }

            camera.position.z = 6;

            // Soft Floating Animation Loop
            function animate() {
                requestAnimationFrame(animate);
                shapes.forEach((shape, index) => {
                    shape.rotation.x += 0.003 * (index + 1);
                    shape.rotation.y += 0.004 * (index + 1);
                });
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Mouse Parallax Interaction for 3D Background
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 0.5;
            const y = (e.clientY / window.innerHeight - 0.5) * 0.5;
            shapes.forEach(shape => {
                shape.position.x += (x - shape.position.x) * 0.02;
                shape.position.y += (-y - shape.position.y) * 0.02;
            });
        });

        /* ==========================================================
           SPLASH SCREEN & THEME ENGINE
           ========================================================== */
        window.addEventListener('load', () => {
            init3D();
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('hidden');
            }, 1200);

            const savedToken = localStorage.getItem("gh_pat_secure");
            const savedOwner = localStorage.getItem("gh_owner_secure");
            if (savedOwner) document.getElementById("ownerInput").value = savedOwner;
            if (savedToken) {
                document.getElementById("tokenInput").value = savedToken;
                initializeDashboard();
            }
        });

        function setTheme(themeName) {
            if (themeName) {
                document.documentElement.setAttribute('data-theme', themeName);
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            showToast(`Theme switched!`);
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        /* ==========================================================
           GITHUB API & BUILD LOGIC
           ========================================================== */
        let intervalId = null, timerIntervalId = null, activeRunId = null, startTime = null;

        function getHeaders() {
            const tokenValue = document.getElementById("tokenInput").value.trim();
            const isFineGrained = tokenValue.startsWith("github_pat_");
            document.getElementById("authModeTag").innerText = isFineGrained ? "FINE-GRAINED" : "CLASSIC PAT";
            return {
                "Authorization": `${isFineGrained ? 'Bearer' : 'token'} ${tokenValue}`,
                "Accept": "application/vnd.github+json"
            };
        }

        async function initializeDashboard() {
            const tokenValue = document.getElementById("tokenInput").value.trim();
            const ownerValue = document.getElementById("ownerInput").value.trim();
            const statusText = document.getElementById("statusText");
            
            if (!tokenValue) {
                statusText.innerText = "Provide Secret Code to unlock.";
                return;
            }

            localStorage.setItem("gh_pat_secure", tokenValue);
            localStorage.setItem("gh_owner_secure", ownerValue);
            statusText.innerText = "Authenticating & Fetching Repos...";
            
            await fetchRepositories();
        }

        async function fetchRepositories() {
            const repoSelect = document.getElementById("repoSelect");
            const statusText = document.getElementById("statusText");
            
            try {
                const response = await fetch(`https://api.github.com/user/repos?per_page=100&sort=pushed`, { headers: getHeaders() });
                if (!response.ok) throw new Error("Invalid Secret Code.");
                
                const repos = await response.json();
                repoSelect.innerHTML = "";
                
                repos.forEach(repo => {
                    let option = document.createElement("option");
                    option.value = repo.name;
                    option.text = repo.name;
                    option.dataset.branch = repo.default_branch;
                    repoSelect.appendChild(option);
                });

                repoSelect.disabled = false;
                onRepoChange();
            } catch (error) {
                statusText.innerText = "Access Denied. Check Secret Code.";
                showErrorInTerminal(error.toString());
            }
        }

        async function onRepoChange() {
            const repoSelect = document.getElementById("repoSelect");
            const branchSelect = document.getElementById("branchSelect");
            const workflowSelect = document.getElementById("workflowSelect");
            const selectedOption = repoSelect.options[repoSelect.selectedIndex];
            
            const repo = repoSelect.value;
            const owner = document.getElementById("ownerInput").value.trim();
            
            document.getElementById("statusText").innerText = `Target: ${repo}`;
            document.getElementById("uploadBtn").disabled = false;
            document.getElementById("retriggerBtn").disabled = false;
            document.getElementById("downloadBtn").disabled = true;
            document.getElementById("progressContainer").style.display = "none";
            
            try {
                const branchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/branches`, { headers: getHeaders() });
                if (branchRes.ok) {
                    const branches = await branchRes.json();
                    branchSelect.innerHTML = "";
                    branches.forEach(b => {
                        let opt = document.createElement("option");
                        opt.value = b.name; opt.text = b.name;
                        if(b.name === selectedOption.dataset.branch) opt.selected = true;
                        branchSelect.appendChild(opt);
                    });
                    branchSelect.disabled = false;
                }
            } catch(e){}

            try {
                const wfRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows`, { headers: getHeaders() });
                if (wfRes.ok) {
                    const wfData = await wfRes.json();
                    workflowSelect.innerHTML = "";
                    if(wfData.workflows && wfData.workflows.length > 0) {
                        wfData.workflows.forEach(w => {
                            let opt = document.createElement("option");
                            opt.value = w.path.split('/').pop();
                            opt.text = w.name || w.path.split('/').pop();
                            workflowSelect.appendChild(opt);
                        });
                        workflowSelect.disabled = false;
                    }
                }
            } catch(e){}
        }

        function startTimer() {
            stopTimer();
            startTime = Date.now();
            timerIntervalId = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                document.getElementById("timerText").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() { if (timerIntervalId) clearInterval(timerIntervalId); }

        async function triggerBuild() {
            const owner = document.getElementById("ownerInput").value.trim();
            const repo = document.getElementById("repoSelect").value;
            const branch = document.getElementById("branchSelect").value;
            const workflow = document.getElementById("workflowSelect").value;
            
            const statusText = document.getElementById("statusText");
            const progressBar = document.getElementById("progressBar");
            
            statusText.innerText = `Triggering build...`;
            document.getElementById("uploadBtn").disabled = true;
            document.getElementById("cancelBtn").disabled = false;
            document.getElementById("logBox").style.display = "none";
            document.getElementById("logTerminal").value = "";
            
            startTimer();

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow}/dispatches`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({ ref: branch })
                });

                if (response.status === 204) {
                    statusText.innerText = "Build dispatched! Waiting for runner...";
                    document.getElementById("progressContainer").style.display = "block";
                    progressBar.style.width = "15%";
                    showToast("Cloud Build Triggered! 🚀");
                    
                    setTimeout(() => { startCheckingStatus(); }, 8000);
                } else {
                    statusText.innerText = `Failed to trigger build.`;
                    document.getElementById("uploadBtn").disabled = false;
                    stopTimer();
                }
            } catch (error) {
                statusText.innerText = `Connection Failed`;
                document.getElementById("uploadBtn").disabled = false;
                stopTimer();
            }
        }

        function startCheckingStatus() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(checkStatus, 12000);
            checkStatus();
        }

        async function checkStatus() {
            const owner = document.getElementById("ownerInput").value.trim();
            const repo = document.getElementById("repoSelect").value;
            const workflow = document.getElementById("workflowSelect").value;
            const statusText = document.getElementById("statusText");
            const progressBar = document.getElementById("progressBar");

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?workflow_id=${workflow}`, { headers: getHeaders() });
                const data = await response.json();

                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const latestRun = data.workflow_runs[0];
                    activeRunId = latestRun.id; 
                    const status = latestRun.status;         
                    const conclusion = latestRun.conclusion; 

                    if (status === "queued") {
                        statusText.innerText = "Status: Queued...";
                        progressBar.style.width = "35%";
                    } else if (status === "in_progress") {
                        statusText.innerText = "Status: Compiling APK...";
                        progressBar.style.width = "65%";
                    } else if (status === "completed") {
                        clearInterval(intervalId);
                        stopTimer();
                        document.getElementById("uploadBtn").disabled = false;
                        document.getElementById("cancelBtn").disabled = true;
                        
                        if (conclusion === "success") {
                            statusText.innerText = "Build Successful! ✅ Ready.";
                            progressBar.style.width = "100%";
                            document.getElementById("downloadBtn").disabled = false;
                            showToast("APK Ready! 🎉");
                        } else {
                            statusText.innerText = `Build Failed ❌ (${conclusion})`;
                            progressBar.style.width = "0%";
                            fetchFailedLogs();
                        }
                    }
                }
            } catch (error) { console.error(error); }
        }

        async function cancelBuild() {
            if (!activeRunId) return;
            const owner = document.getElementById("ownerInput").value.trim();
            const repo = document.getElementById("repoSelect").value;
            try {
                await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${activeRunId}/cancel`, {
                    method: "POST", headers: getHeaders()
                });
                showToast("Cancel signal sent.");
            } catch(e){}
        }

        async function fetchFailedLogs() {
            if (!activeRunId) return;
            const owner = document.getElementById("ownerInput").value.trim();
            const repo = document.getElementById("repoSelect").value;
            
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${activeRunId}/jobs`, { headers: getHeaders() });
                const data = await response.json();
                let errorDetails = `=== COMPILATION FAULT REPORT ===\nRun ID: ${activeRunId}\n\n`;
                if(data.jobs && data.jobs.length > 0) {
                    data.jobs.forEach(job => {
                        errorDetails += `Job: ${job.name} -> Status: ${job.conclusion}\n`;
                        if(job.steps) {
                            job.steps.forEach(step => {
                                if(step.conclusion === "failure") errorDetails += `❌ Step Failed: "${step.name}"\n`;
                            });
                        }
                    });
                }
                showErrorInTerminal(errorDetails);
            } catch (e) { showErrorInTerminal(e.toString()); }
        }

        function showErrorInTerminal(text) {
            const logBox = document.getElementById("logBox");
            const logTerminal = document.getElementById("logTerminal");
            logBox.style.display = "block";
            logTerminal.value = text;
        }

        function copyLogs() {
            const logTerminal = document.getElementById("logTerminal");
            if (!logTerminal.value) return showToast("No logs to copy!");
            logTerminal.select();
            navigator.clipboard.writeText(logTerminal.value);
            showToast("Logs copied! 📋");
        }

        async function downloadArtifact() {
            const owner = document.getElementById("ownerInput").value.trim();
            const repo = document.getElementById("repoSelect").value;
            const customName = document.getElementById("apkNameInput").value.trim() || `${repo}-build.apk`;
            const statusText = document.getElementById("statusText");
            
            statusText.innerText = "Locating artifact...";

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/artifacts`, { headers: getHeaders() });
                const data = await response.json();

                if (data.artifacts && data.artifacts.length > 0) {
                    const artifactId = data.artifacts[0].id;
                    statusText.innerText = "Downloading bundle...";
                    showToast("Downloading APK archive...");
                    
                    const downloadUrl = `https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${artifactId}/zip`;
                    
                    fetch(downloadUrl, { headers: getHeaders() })
                        .then(res => { if (!res.ok) throw new Error("Stream failure."); return res.arrayBuffer(); })
                        .then(buffer => {
                            statusText.innerText = "Extracting APK in memory...";
                            
                            const zippedUint8 = new Uint8Array(buffer);
                            const unzippedFiles = fflate.unzipSync(zippedUint8);
                            let apkFileName = Object.keys(unzippedFiles).find(name => name.endsWith('.apk'));
                            if (!apkFileName) throw new Error("No .apk binary inside bundle.");
                            
                            const apkData = unzippedFiles[apkFileName];
                            const blob = new Blob([apkData], { type: "application/vnd.android.package-archive" });
                            
                            const url = window.URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.setAttribute('download', customName.endsWith('.apk') ? customName : `${customName}.apk`);
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                            window.URL.revokeObjectURL(url);
                            
                            statusText.innerText = "APK Extracted & Downloaded!";
                            showToast("APK Saved to Downloads! 📦");
                        }).catch((err) => {
                            statusText.innerText = `Extraction failed: ${err.message}`;
                            showErrorInTerminal(err.toString());
                        });
                } else { statusText.innerText = "No build artifacts found."; }
            } catch (error) { showErrorInTerminal(error.toString()); }
        }
    </script>
</body>
</html>
