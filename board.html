<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aklavya's World - Complete Collaborative Studio</title>
  
  <!-- Firebase App & Database (Compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #eef2f5;
      --board-bg: #ffffff;
      --board-border: #007bff;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }

    /* Splash Screen Overlay */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #007bff, #6610f2);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    #splash-screen h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s ease-in-out infinite;
      margin-top: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Top Bar */
    #top-bar {
      background: var(--panel-bg);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 400;
      gap: 8px;
      overflow-x: auto;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .top-actions button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .top-actions button.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    .status-text {
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Canvas Viewport */
    #app-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 6px;
    }

    /* Board Frame (9:16 Aspect Ratio) */
    #board-frame {
      position: relative;
      background-color: var(--board-bg);
      border: 3px dashed var(--board-border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;

      height: min(92vh, calc(96vw * (16 / 9)));
      width: min(96vw, calc(92vh * (9 / 16)));
      aspect-ratio: 9 / 16;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* FLOATING TOGGLE BUTTON - MOVED TO LEFT SIDE */
    #floating-toggle {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #007bff;
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      font-size: 24px;
      cursor: pointer;
      z-index: 500;
    }

    /* SUBMENU TRAY - OPENING FROM LEFT SIDE */
    #tool-panel {
      position: fixed;
      bottom: 84px;
      left: 20px;
      width: 320px;
      max-height: 75vh;
      background: var(--panel-bg);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      z-index: 499;
    }

    .category-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .menu-btn {
      padding: 10px 8px;
      border: 1px solid #ccc;
      background: #f8f9fa;
      color: var(--text-color);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dialog Popups */
    .custom-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      padding: 18px;
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 850;
      overflow-y: auto;
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .dialog-header h3 {
      font-size: 16px;
      color: #007bff;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 50 Colors Palette Grid */
    #color-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    /* Shapes & Stickers Grids */
    .shapes-grid, .stickers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .shape-item, .sticker-item {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      cursor: pointer;
      background: white;
    }

    .shape-item:hover, .sticker-item:hover {
      background: #e9ecef;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <h1>Aklavya's World</h1>
    <p>Loading Collaborative Studio...</p>
    <div class="spinner"></div>
  </div>

  <!-- Top Action Bar -->
  <div id="top-bar">
    <div class="top-actions">
      <button onclick="undoLastStroke()">↩️ Undo</button>
      <button onclick="clearCanvas(true)">🗑️ Clear</button>
      <button id="btn-pen" class="active" onclick="setTool('pen')">✏️ Pen</button>
      <button id="btn-eraser" onclick="setTool('eraser')">🧹 Eraser</button>
      <button id="btn-text" onclick="setTool('text')">🔤 Text</button>
      <button id="btn-move" onclick="setTool('move')">✋ Move Canvas</button>
    </div>
    <div class="status-text">
      <span style="color: #28a745;">● Live Sync</span>
    </div>
  </div>

  <!-- Canvas Viewport -->
  <div id="app-viewport">
    <div id="board-frame">
      <canvas id="whiteboard"></canvas>
    </div>
  </div>

  <!-- FLOATING TOGGLE BUTTON (ON LEFT SIDE) -->
  <button id="floating-toggle" onclick="toggleToolPanel()">🛠️</button>

  <!-- Submenu Tray -->
  <div id="tool-panel">
    <div class="category-title">Canvas Tools & Media</div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="openDialog('colors-dialog')">🎨 Colors (50)</button>
      <button class="menu-btn" onclick="openDialog('shapes-dialog')">📐 30 Shapes</button>
      <button class="menu-btn" onclick="openDialog('stickers-dialog')">😍 Stickers</button>
      <button class="menu-btn" onclick="downloadPNG()">💾 Save PNG</button>
    </div>
  </div>

  <!-- Colors Dialog (50 Colors + Size Slider) -->
  <div id="colors-dialog" class="custom-dialog">
    <div class="dialog-header">
      <h3>Color & Brush</h3>
      <button class="close-btn" onclick="closeDialog('colors-dialog')">✕</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
      <label style="font-size: 12px; font-weight: bold;">Size:</label>
      <input type="range" id="lineWidth" min="1" max="50" value="5" style="flex:1;">
      <input type="color" id="colorPicker" value="#000000" style="width:32px; height:32px; border:none; cursor:pointer;">
    </div>
    <div class="category-title">50 Color Presets</div>
    <div id="color-grid"></div>
  </div>

  <!-- 30 Shapes Dialog -->
  <div id="shapes-dialog" class="custom-dialog">
    <div class="dialog-header">
      <h3>Select Shape</h3>
      <button class="close-btn" onclick="closeDialog('shapes-dialog')">✕</button>
    </div>
    <div class="shapes-grid" id="shapes-container"></div>
  </div>

  <!-- Stickers Dialog -->
  <div id="stickers-dialog" class="custom-dialog">
    <div class="dialog-header">
      <h3>Select Sticker</h3>
      <button class="close-btn" onclick="closeDialog('stickers-dialog')">✕</button>
    </div>
    <div class="stickers-grid" id="stickers-container"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA9Bwx5nWDS5ZIDDiUFw9JYG3V-AVTbR9s",
      authDomain: "jewelbook-bb7b3.firebaseapp.com",
      databaseURL: "https://jewelbook-bb7b3-default-rtdb.firebaseio.com",
      projectId: "jewelbook-bb7b3",
      storageBucket: "jewelbook-bb7b3.firebasestorage.app",
      messagingSenderId: "318025398538",
      appId: "1:318025398538:web:48e7ad6cd8f65b4b0ba2f3",
      measurementId: "G-J84BK5F87Q"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const boardFrame = document.getElementById('board-frame');
    const colorPicker = document.getElementById('colorPicker');
    const lineWidth = document.getElementById('lineWidth');

    let isDrawing = false, isPanning = false;
    let roomRef = null, strokesRef = null;
    let currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);
    let activeTool = 'pen'; 
    let activeShape = 'rect', activeSticker = '🔥';
    let currentStrokePoints = [], strokesData = {};
    let panX = 0, panY = 0, startPanX = 0, startPanY = 0;

    // 50 Palette Colors
    const presetColors = [
      "#000000","#333333","#666666","#999999","#cccccc","#ffffff","#980000","#ff0000","#ff9900","#ffff00",
      "#00ff00","#00ffff","#4a86e8","#0000ff","#9900ff","#ff00ff","#e6b8af","#f42020","#fce5cd","#fff2cc",
      "#d9ead3","#d0e0e3","#c9daf8","#cfe2f3","#d9d2e9","#ead1dc","#dd7e6b","#cc0000","#e69138","#f1c232",
      "#6aa84f","#45818e","#3c78d8","#3d85c6","#674ea7","#a64d79","#a61c1c","#85200c","#990000","#b45f06",
      "#bf9000","#38761d","#134f5c","#1155cc","#0b5394","#351c75","#741b47","#5b0f0f","#783f04","#274e13"
    ];

    // 30 Shape Definitions
    const shapeList = [
      { name: 'Rectangle', icon: '▭', type: 'rect' },
      { name: 'Square', icon: '▢', type: 'square' },
      { name: 'Circle', icon: '◯', type: 'circle' },
      { name: 'Ellipse', icon: '⬏', type: 'ellipse' },
      { name: 'Triangle', icon: '△', type: 'triangle' },
      { name: 'Line', icon: '╱', type: 'line' },
      { name: 'Star', icon: '★', type: 'star' },
      { name: 'Arrow', icon: '➔', type: 'arrow' },
      { name: 'Diamond', icon: '◆', type: 'diamond' },
      { name: 'Pentagon', icon: '⬟', type: 'pentagon' },
      { name: 'Hexagon', icon: '⬡', type: 'hexagon' },
      { name: 'Heart', icon: '♥', type: 'heart' },
      { name: 'Right Triangle', icon: '⊿', type: 'right_triangle' },
      { name: 'Trapezoid', icon: '⏢', type: 'trapezoid' },
      { name: 'Parallelogram', icon: '▰', type: 'parallelogram' },
      { name: 'Cross', icon: '┼', type: 'cross' },
      { name: 'Check', icon: '✓', type: 'check' },
      { name: 'Speech Bubble', icon: '💬', type: 'speech' },
      { name: 'Cloud', icon: '☁', type: 'cloud' },
      { name: 'Moon', icon: '🌙', type: 'moon' },
      { name: 'Lightning', icon: '⚡', type: 'lightning' },
      { name: 'Ring', icon: '◎', type: 'ring' },
      { name: 'Cylinder', icon: '⬭', type: 'cylinder' },
      { name: 'Cube', icon: '🧊', type: 'cube' },
      { name: 'Octagon', icon: '🛑', type: 'octagon' },
      { name: 'Plus', icon: '➕', type: 'plus' },
      { name: 'Minus', icon: '➖', type: 'minus' },
      { name: 'Infinity', icon: '♾️', type: 'infinity' },
      { name: 'Double Arrow', icon: '↔', type: 'double_arrow' },
      { name: 'Curved Line', icon: '∿', type: 'curved_line' }
    ];

    // Stickers List
    const stickerList = ['🔥', '❤️', '⭐', '🎉', '👍', '💡', '🚀', '🎨', '✨', '💯', '👏', '🥳', '💩', '😎', '🏆'];

    function initColorPalette() {
      const grid = document.getElementById('color-grid');
      grid.innerHTML = '';
      presetColors.forEach((hex) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = hex;
        swatch.onclick = () => { colorPicker.value = hex; };
        grid.appendChild(swatch);
      });

      // Populate 30 Shapes
      const shapesGrid = document.getElementById('shapes-container');
      shapesGrid.innerHTML = '';
      shapeList.forEach(s => {
        const item = document.createElement('div');
        item.className = 'shape-item';
        item.innerText = s.icon;
        item.title = s.name;
        item.onclick = () => { setTool('shape'); activeShape = s.type; closeDialog('shapes-dialog'); };
        shapesGrid.appendChild(item);
      });

      // Populate Stickers
      const stickersGrid = document.getElementById('stickers-container');
      stickersGrid.innerHTML = '';
      stickerList.forEach(st => {
        const item = document.createElement('div');
        item.className = 'sticker-item';
        item.innerText = st;
        item.onclick = () => { setTool('sticker'); activeSticker = st; closeDialog('stickers-dialog'); };
        stickersGrid.appendChild(item);
      });
    }

    function initApp() {
      initColorPalette();
      joinGlobalBoard();
    }

    function joinGlobalBoard() {
      roomRef = db.ref('boards/world-global');
      strokesRef = roomRef.child('strokes');

      strokesRef.on('value', (snapshot) => {
        strokesData = snapshot.val() || {};
        redrawAllStrokes();
      });

      resizeCanvas();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 400); }
      }, 500);
    }

    function resizeCanvas() {
      const rect = boardFrame.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      redrawAllStrokes();
    }

    window.addEventListener('resize', resizeCanvas);

    function toggleToolPanel() {
      const panel = document.getElementById('tool-panel');
      panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
    }

    function openDialog(id) {
      document.getElementById(id).style.display = 'flex';
      document.getElementById('tool-panel').style.display = 'none';
    }

    function closeDialog(id) {
      document.getElementById(id).style.display = 'none';
    }

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.top-actions button').forEach(b => b.classList.remove('active'));
      if (document.getElementById(`btn-${tool}`)) document.getElementById(`btn-${tool}`).classList.add('active');
    }

    function getPointerPos(e) {
      const rect = boardFrame.getBoundingClientRect();
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        xRatio: (clientX - rect.left - panX) / rect.width,
        yRatio: (clientY - rect.top - panY) / rect.height,
        rawX: clientX,
        rawY: clientY
      };
    }

    function startDrawing(e) {
      const pos = getPointerPos(e);

      if (activeTool === 'move') {
        isPanning = true;
        startPanX = pos.rawX - panX;
        startPanY = pos.rawY - panY;
        return;
      }

      if (activeTool === 'text') {
        const txt = prompt("Enter text to add to board:");
        if (txt && strokesRef) {
          strokesRef.push({
            type: 'text',
            text: txt,
            xRatio: pos.xRatio,
            yRatio: pos.yRatio,
            color: colorPicker.value,
            size: lineWidth.value * 3
          });
        }
        return;
      }

      if (activeTool === 'sticker') {
        if (strokesRef) {
          strokesRef.push({
            type: 'sticker',
            sticker: activeSticker,
            xRatio: pos.xRatio,
            yRatio: pos.yRatio,
            size: lineWidth.value * 4
          });
        }
        return;
      }

      isDrawing = true;
      currentStrokePoints = [{ xRatio: pos.xRatio, yRatio: pos.yRatio }];
    }

    function draw(e) {
      const pos = getPointerPos(e);

      if (isPanning) {
        panX = pos.rawX - startPanX;
        panY = pos.rawY - startPanY;
        redrawAllStrokes();
        return;
      }

      if (!isDrawing) return;
      currentStrokePoints.push({ xRatio: pos.xRatio, yRatio: pos.yRatio });
      redrawAllStrokes();
    }

    function stopDrawing(e) {
      isPanning = false;
      if (!isDrawing) return;
      isDrawing = false;

      if (currentStrokePoints.length > 0 && strokesRef) {
        strokesRef.push({
          type: activeTool === 'shape' ? 'shape' : 'pen',
          shapeType: activeShape,
          tool: activeTool,
          points: currentStrokePoints,
          color: activeTool === 'eraser' ? '#ffffff' : colorPicker.value,
          size: lineWidth.value
        });
      }
      currentStrokePoints = [];
    }

    function drawBackgroundGrid() {
      const rect = boardFrame.getBoundingClientRect();
      ctx.save();
      ctx.strokeStyle = "rgba(0,0,0,0.06)";
      for (let x = panX % 20; x < rect.width; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
      }
      for (let y = panY % 20; y < rect.height; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawCustomPolygon(ctx, cx, cy, radius, sides) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function renderItemLocally(item) {
      const rect = boardFrame.getBoundingClientRect();
      ctx.save();

      // Text Tool Render
      if (item.type === 'text') {
        ctx.font = `${item.size || 20}px sans-serif`;
        ctx.fillStyle = item.color || '#000';
        ctx.fillText(item.text, item.xRatio * rect.width + panX, item.yRatio * rect.height + panY);
        ctx.restore();
        return;
      }

      // Sticker Tool Render
      if (item.type === 'sticker') {
        ctx.font = `${item.size || 30}px sans-serif`;
        ctx.fillText(item.sticker, item.xRatio * rect.width + panX, item.yRatio * rect.height + panY);
        ctx.restore();
        return;
      }

      if (!item.points || item.points.length === 0) { ctx.restore(); return; }

      ctx.lineWidth = item.size || 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = item.color;
      ctx.fillStyle = item.color;

      // Shapes Rendering
      if (item.type === 'shape' && item.points.length > 1) {
        const start = item.points[0];
        const end = item.points[item.points.length - 1];
        const sx = start.xRatio * rect.width + panX;
        const sy = start.yRatio * rect.height + panY;
        const ex = end.xRatio * rect.width + panX;
        const ey = end.yRatio * rect.height + panY;

        ctx.beginPath();
        if (item.shapeType === 'rect' || item.shapeType === 'square') {
          ctx.strokeRect(sx, sy, ex - sx, ey - sy);
        } else if (item.shapeType === 'circle' || item.shapeType === 'ring') {
          const r = Math.hypot(ex - sx, ey - sy);
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.stroke();
        } else if (item.shapeType === 'triangle') {
          ctx.moveTo((sx + ex) / 2, sy);
          ctx.lineTo(sx, ey);
          ctx.lineTo(ex, ey);
          ctx.closePath();
          ctx.stroke();
        } else if (item.shapeType === 'line' || item.shapeType === 'double_arrow') {
          ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
        } else if (item.shapeType === 'star') {
          const r = Math.hypot(ex - sx, ey - sy);
          drawCustomPolygon(ctx, sx, sy, r, 5);
        } else if (item.shapeType === 'pentagon') {
          const r = Math.hypot(ex - sx, ey - sy);
          drawCustomPolygon(ctx, sx, sy, r, 5);
        } else if (item.shapeType === 'hexagon') {
          const r = Math.hypot(ex - sx, ey - sy);
          drawCustomPolygon(ctx, sx, sy, r, 6);
        } else if (item.shapeType === 'octagon') {
          const r = Math.hypot(ex - sx, ey - sy);
          drawCustomPolygon(ctx, sx, sy, r, 8);
        } else {
          // Default fallthrough shape
          ctx.strokeRect(sx, sy, ex - sx, ey - sy);
        }
        ctx.restore();
        return;
      }

      // Freehand Pen/Eraser Strokes
      ctx.beginPath();
      ctx.moveTo(item.points[0].xRatio * rect.width + panX, item.points[0].yRatio * rect.height + panY);
      for (let i = 1; i < item.points.length; i++) {
        ctx.lineTo(item.points[i].xRatio * rect.width + panX, item.points[i].yRatio * rect.height + panY);
      }
      ctx.stroke();
      ctx.restore();
    }

    function redrawAllStrokes() {
      const rect = boardFrame.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawBackgroundGrid();

      Object.keys(strokesData).forEach(key => {
        renderItemLocally(strokesData[key]);
      });

      if (isDrawing && currentStrokePoints.length > 0) {
        renderItemLocally({
          type: activeTool === 'shape' ? 'shape' : 'pen',
          shapeType: activeShape,
          tool: activeTool,
          points: currentStrokePoints,
          color: activeTool === 'eraser' ? '#ffffff' : colorPicker.value,
          size: lineWidth.value
        });
      }
    }

    function undoLastStroke() {
      if (!strokesRef) return;
      const keys = Object.keys(strokesData);
      if (keys.length > 0) {
        strokesRef.child(keys[keys.length - 1]).remove();
      }
    }

    function clearCanvas(broadcast) {
      if (broadcast && strokesRef) {
        strokesRef.set(null);
      }
    }

    function downloadPNG() {
      const link = document.createElement('a');
      link.download = 'aklavya-world-drawing.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    initApp();
  </script>
</body>
</html>
