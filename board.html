<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aklavya's World - Real-Time Collaborative Canvas</title>
  
  <!-- Firebase App (Compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <!-- Firebase Realtime Database (Compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #eef2f5;
      --board-bg: #ffffff;
      --board-border: #007bff;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --text-color: #333333;
    }

    body.theme-dark {
      --bg-color: #121212;
      --board-bg: #1e1e1e;
      --board-border: #0d6efd;
      --panel-bg: rgba(30, 30, 30, 0.96);
      --text-color: #f1f1f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }

    /* Splash Screen Overlay */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #007bff, #6610f2);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    #splash-screen h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s ease-in-out infinite;
      margin-top: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Top Action Bar */
    #top-bar {
      background: var(--panel-bg);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 400;
      gap: 8px;
      overflow-x: auto;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .top-actions button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .top-actions button.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    .status-text {
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-connected { color: #28a745; }
    .status-disconnected { color: #dc3545; }

    /* Canvas Viewport Area */
    #app-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 6px;
      box-sizing: border-box;
    }

    /* Portrait Frame (9:16 Aspect Ratio) */
    #board-frame {
      position: relative;
      background-color: var(--board-bg);
      border: 3px dashed var(--board-border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;

      height: min(92vh, calc(96vw * (16 / 9)));
      width: min(96vw, calc(92vh * (9 / 16)));
      aspect-ratio: 9 / 16;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating Toggle Button */
    #floating-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #007bff;
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      font-size: 24px;
      cursor: pointer;
      z-index: 500;
    }

    /* Submenu Tray */
    #tool-panel {
      position: fixed;
      bottom: 84px;
      right: 20px;
      width: 320px;
      max-height: 75vh;
      background: var(--panel-bg);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 499;
    }

    .category-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .menu-btn {
      padding: 8px 6px;
      border: 1px solid #ccc;
      background: transparent;
      color: var(--text-color);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dialog Popups */
    .custom-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      padding: 18px;
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 850;
      overflow-y: auto;
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .dialog-header h3 {
      font-size: 16px;
      color: #007bff;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #color-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      max-height: 120px;
      overflow-y: auto;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <h1>Aklavya's World</h1>
    <p>Loading Global Portrait Canvas...</p>
    <div class="spinner"></div>
  </div>

  <!-- Priority Top Action Bar -->
  <div id="top-bar">
    <div class="top-actions">
      <button onclick="undoLastStroke()">↩️ Undo</button>
      <button onclick="redoLastStroke()">↪️ Redo</button>
      <button onclick="clearCanvas(true)">🗑️ Clear</button>
      <button id="top-select-btn" onclick="setTool('select')">✋ Move</button>
      <button id="top-pen-btn" class="active" onclick="setTool('pen')">✏️ Pen</button>
    </div>
    <div class="status-text">
      <span id="peer-status" class="status-disconnected">Connecting...</span> | <span id="user-count">👥 1</span>
    </div>
  </div>

  <!-- Canvas Viewport -->
  <div id="app-viewport">
    <div id="board-frame">
      <canvas id="whiteboard"></canvas>
    </div>
  </div>

  <!-- Floating Toggle Button -->
  <button id="floating-toggle" onclick="toggleToolPanel()">🛠️</button>

  <!-- Main Menu Panel -->
  <div id="tool-panel">
    <div class="category-title">Tool Submenus</div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="openDialog('colors-dialog')">🎨 Colors (50)</button>
      <button class="menu-btn" onclick="openDialog('tools-dialog')">✒️ Drawing Tools</button>
      <button class="menu-btn" onclick="downloadPNG()">💾 Save PNG</button>
    </div>
  </div>

  <!-- Colors Dialog -->
  <div id="colors-dialog" class="custom-dialog">
    <div class="dialog-header">
      <h3>Color Customization</h3>
      <button class="close-btn" onclick="closeDialog('colors-dialog')">✕</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
      <label style="font-size: 12px; font-weight: bold;">Thickness:</label>
      <input type="range" id="lineWidth" min="1" max="50" value="5" style="flex:1;">
      <input type="color" id="colorPicker" value="#000000" style="width:30px; height:30px; border:none; cursor:pointer;">
    </div>
    <div class="category-title">50 Color Presets</div>
    <div id="color-grid"></div>
  </div>

  <!-- Tools Dialog -->
  <div id="tools-dialog" class="custom-dialog">
    <div class="dialog-header">
      <h3>Drawing Tools</h3>
      <button class="close-btn" onclick="closeDialog('tools-dialog')">✕</button>
    </div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="setTool('pen'); closeDialog('tools-dialog');">✏️ Pen</button>
      <button class="menu-btn" onclick="setTool('eraser'); closeDialog('tools-dialog');">🧹 Eraser</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA9Bwx5nWDS5ZIDDiUFw9JYG3V-AVTbR9s",
      authDomain: "jewelbook-bb7b3.firebaseapp.com",
      databaseURL: "https://jewelbook-bb7b3-default-rtdb.firebaseio.com",
      projectId: "jewelbook-bb7b3",
      storageBucket: "jewelbook-bb7b3.firebasestorage.app",
      messagingSenderId: "318025398538",
      appId: "1:318025398538:web:48e7ad6cd8f65b4b0ba2f3",
      measurementId: "G-J84BK5F87Q"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const boardFrame = document.getElementById('board-frame');
    const colorPicker = document.getElementById('colorPicker');
    const lineWidth = document.getElementById('lineWidth');

    let isDrawing = false;
    let roomRef = null, strokesRef = null;
    let currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);
    let activeTool = 'pen';
    let currentStrokePoints = [], strokesData = {};

    const presetColors = [
      "#000000", "#434343", "#666666", "#999999", "#b7b7b7", "#cccccc", "#d9d9d9", "#efefef", "#f3f3f3", "#ffffff",
      "#980000", "#ff0000", "#ff9900", "#ffff00", "#00ff00", "#00ffff", "#4a86e8", "#0000ff", "#9900ff", "#ff00ff"
    ];

    function initColorPalette() {
      const grid = document.getElementById('color-grid');
      grid.innerHTML = '';
      presetColors.forEach((hex) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = hex;
        swatch.onclick = () => { colorPicker.value = hex; };
        grid.appendChild(swatch);
      });
    }

    function initApp() {
      initColorPalette();
      joinGlobalBoard();
    }

    function joinGlobalBoard() {
      roomRef = db.ref('boards/world-global');
      strokesRef = roomRef.child('strokes');

      // Live Firebase Realtime Sync
      strokesRef.on('value', (snapshot) => {
        strokesData = snapshot.val() || {};
        redrawAllStrokes();

        // Send canvas snapshot to Android Widget Bridge
        notifyAndroidWidget();
      });

      updateStatus(true, `Connected (Portrait Board)`);
      resizeCanvas();

      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.display = 'none', 400);
        }
      }, 500);
    }

    function notifyAndroidWidget() {
      if (window.AndroidInterface && window.AndroidInterface.updateWidgetImage) {
        try {
          // Export high quality canvas snapshot to native Java
          const dataUrl = canvas.toDataURL('image/png', 1.0);
          window.AndroidInterface.updateWidgetImage(dataUrl);
        } catch (e) {
          console.error("Widget bridge error:", e);
        }
      }
    }

    function resizeCanvas() {
      const rect = boardFrame.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      redrawAllStrokes();
    }

    window.addEventListener('resize', resizeCanvas);

    function toggleToolPanel() {
      const panel = document.getElementById('tool-panel');
      panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
    }

    function openDialog(id) {
      document.getElementById(id).style.display = 'flex';
      document.getElementById('tool-panel').style.display = 'none';
    }

    function closeDialog(id) {
      document.getElementById(id).style.display = 'none';
    }

    function setTool(tool) {
      activeTool = tool;
      document.getElementById('top-select-btn').className = tool === 'select' ? 'active' : '';
      document.getElementById('top-pen-btn').className = tool === 'pen' ? 'active' : '';
    }

    function getPointerPos(e) {
      const rect = boardFrame.getBoundingClientRect();
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        xRatio: (clientX - rect.left) / rect.width,
        yRatio: (clientY - rect.top) / rect.height
      };
    }

    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      currentStrokePoints = [getPointerPos(e)];
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      currentStrokePoints.push(getPointerPos(e));
      redrawAllStrokes();
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentStrokePoints.length > 0 && strokesRef) {
        strokesRef.push({
          userId: currentUserId,
          tool: activeTool,
          points: currentStrokePoints,
          color: activeTool === 'eraser' ? '#ffffff' : colorPicker.value,
          size: lineWidth.value
        });
      }
      currentStrokePoints = [];
    }

    function drawBackgroundGrid() {
      const rect = boardFrame.getBoundingClientRect();
      ctx.save();
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      for (let x = 0; x < rect.width; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
      }
      for (let y = 0; y < rect.height; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
      }
      ctx.restore();
    }

    function renderStrokeLocally(stroke) {
      if (!stroke.points || stroke.points.length === 0) return;
      const rect = boardFrame.getBoundingClientRect();
      ctx.save();
      ctx.lineWidth = stroke.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = stroke.color;

      ctx.beginPath();
      ctx.moveTo(stroke.points[0].xRatio * rect.width, stroke.points[0].yRatio * rect.height);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].xRatio * rect.width, stroke.points[i].yRatio * rect.height);
      }
      ctx.stroke();
      ctx.restore();
    }

    function redrawAllStrokes() {
      const rect = boardFrame.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawBackgroundGrid();

      Object.keys(strokesData).forEach(key => {
        renderStrokeLocally(strokesData[key]);
      });

      if (isDrawing && currentStrokePoints.length > 0) {
        renderStrokeLocally({
          tool: activeTool,
          points: currentStrokePoints,
          color: activeTool === 'eraser' ? '#ffffff' : colorPicker.value,
          size: lineWidth.value
        });
      }
    }

    function undoLastStroke() {
      if (!strokesRef) return;
      const keys = Object.keys(strokesData);
      if (keys.length > 0) {
        strokesRef.child(keys[keys.length - 1]).remove();
      }
    }

    function clearCanvas(broadcast) {
      if (broadcast && strokesRef) {
        strokesRef.set(null);
      }
    }

    function downloadPNG() {
      const link = document.createElement('a');
      link.download = 'aklavya-world-drawing.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    function updateStatus(isConnected, message) {
      const statusElem = document.getElementById('peer-status');
      if (statusElem) {
        statusElem.innerText = message;
      }
    }

    initApp();
  </script>
</body>
</html>
